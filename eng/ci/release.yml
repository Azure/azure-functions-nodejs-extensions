parameters:
  - name: PackageArtifact
    displayName: 'Package'
    type: string
    values:
      - azure-functions-nodejs-extensions-base
      - azure-functions-nodejs-extensions-blob
      - azure-functions-nodejs-extensions-servicebus
  - name: NpmPublishTag
    displayName: 'npm tag'
    type: string
    default: 'latest'
  - name: NpmPublishDryRun
    displayName: 'Dry run'
    type: boolean
    default: true

trigger: none
pr: none

resources:
  repositories:
    - repository: 1es
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
    - repository: eng
      type: git
      name: engineering
      ref: refs/tags/release
  pipelines:
    - pipeline: officialBuild
      project: internal
      source: azure-functions-nodejs-extensions.official
      branch: main

variables:
  - group: azure-functions-nodejs-extensions-release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1es
  parameters:
    sdl:
      sourceAnalysisPool:
        name: 1es-pool-azfunc
        image: 1es-windows-2022
        os: windows
      codeql:
        runSourceLanguagesInSourceAnalysis: true

    stages:
      - stage: Release
        pool:
          name: 1es-pool-azfunc
          image: 1es-ubuntu-22.04
          os: linux
        jobs:
          - ${{ if eq(parameters.NpmPublishDryRun, true) }}:
            - job: ValidateRelease
              displayName: 'Validate npm release'
              steps:
                - download: officialBuild
                  artifact: ${{ parameters.PackageArtifact }}
                - template: /eng/templates/steps/npm-publish-dry-run.yml@self
                  parameters:
                    tgzPath: '$(Pipeline.Workspace)/officialBuild/${{ parameters.PackageArtifact }}'
                    packageDirectory: '$(Build.SourcesDirectory)/${{ parameters.PackageArtifact }}'
                    NpmPublishTag: ${{ parameters.NpmPublishTag }}
          - ${{ if eq(parameters.NpmPublishDryRun, false) }}:
            - template: /ci/release-npm-package.yml@eng
              parameters:
                artifact:
                  name: ${{ parameters.PackageArtifact }}
                  pipeline: officialBuild
                publishMethod: esrp
                esrpNpmTag: ${{ parameters.NpmPublishTag }}
                approvers: '$(EsrpManualApprovers)'
